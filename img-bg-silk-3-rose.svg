<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Calm variant for text-heavy blocks: soft taupe field with light glows and one gentle wave -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F0F0"/><stop offset=".6" stop-color="#ECE7E7"/><stop offset="1" stop-color="#E8D3D4"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade"><stop offset="0" stop-color="#B08C8E" stop-opacity=".35"/><stop offset="1" stop-color="#B08C8E" stop-opacity="0"/></radialGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2E2E2"/><stop offset="1" stop-color="#E3C6C7"/></linearGradient>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <path d="M1700 620C1400 600 1180 700 980 820C800 930 600 960 380 1100L1700 1100Z" fill="url(#w)" filter="url(#soft)" opacity=".9"/>
  <ellipse cx="420" cy="260" rx="620" ry="360" fill="url(#glow)" filter="url(#haze)"/>
  <ellipse cx="1350" cy="820" rx="520" ry="300" fill="url(#shade)" filter="url(#haze)"/>
  <ellipse cx="1250" cy="180" rx="300" ry="200" fill="url(#glow)" opacity=".6" filter="url(#haze)"/>
</svg>
